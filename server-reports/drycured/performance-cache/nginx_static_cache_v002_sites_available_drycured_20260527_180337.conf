server {
    listen 80;
    server_name drycured.com www.drycured.com;
    return 301 https://drycured.com$request_uri;
}
server {
    listen 443 ssl;
    server_name drycured.com www.drycured.com;
    root /var/www/html;
    client_max_body_size 256M;
    index index.php index.html;

    include /etc/nginx/snippets/drycured-gzip-types.conf;
    include /etc/nginx/snippets/drycured-static-cache.conf;
    ssl_certificate /etc/letsencrypt/live/drycured.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drycured.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
}
