# Drycured.com static asset browser cache.
# Applies only to real static files, not PHP/HTML pages.
location ~* \.(?:css|js|mjs|json|xml|svg|svgz|ico|jpg|jpeg|png|gif|webp|avif|woff|woff2|ttf|eot|otf)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
    add_header Vary "Accept-Encoding" always;
}
