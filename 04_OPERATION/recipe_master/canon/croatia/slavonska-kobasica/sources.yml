confirmed_facts:
  - Recept pripada slavonskom kobasičarskom modelu.
  - Osnovu čini svinjsko meso s leđnom slaninom.
  - Začinski profil temelji se na soli, slatkoj i ljutoj paprici te češnjaku.
  - Koriste se tanka svinjska crijeva.
  - Dimljenje je hladno i višednevno.
  - Nakon dimljenja slijedi sušenje i zrenje.

