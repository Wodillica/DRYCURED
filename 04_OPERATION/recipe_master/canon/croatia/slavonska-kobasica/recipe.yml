process:
  - phase_no: 1
    title: Hlađenje i priprema sirovine
    duration: prije mljevenja, dok sirovina ne bude čvrsta i hladna
    temperature_c: hladno/prohladno, točna temperatura nije navedena u izvoru
    action: >
      Meso očistiti od grubljeg vezivnog tkiva i narezati na komade prikladne
      za mljevenje. Leđnu slaninu očistiti od kožice i također pripremiti za mljevenje.
    goal: čista, hladna sirovina koja se može samljeti bez razmazivanja masnoće
    critical_control: sirovina ne smije omekšati ni postati ljepljiva
    problem: razmazana masnoća i mutan presjek
    solution: prekinuti rad, vratiti meso i slaninu na hlađenje, nastaviti tek kad su čvrsti
    source_status: derived_from_process_and_project_rules
  - phase_no: 2
    title: Mljevenje mesa i slanine
    duration: neposredno prije miješanja
    temperature_c: hladna sirovina
    action: >
      Svinjsko meso samljeti kroz rešetku 14 mm, a tvrdu leđnu slaninu
      kroz rešetku 8 mm.
    goal: dobiti jasno vidljivu, krupniju strukturu slavonske kobasice
    critical_control: ne raditi s toplom masnoćom
    problem: mast se razmaže po mesu
    solution: ohladiti sirovinu i dijelove stroja, zatim ponoviti mljevenje sporije
    source_status: confirmed_pavicic
  - phase_no: 3
    title: Začinjavanje i miješanje nadjeva
    duration: 30 minuta
    temperature_c: prohladna prostorija
    action: >
      U mljeveno meso i slaninu dodati sol, papriku i češnjak te miješati
      dok nadjev ne postane jednoličan. Ako se koristi varijanta s bijelim
      paprom i šećerom, dodaju se zajedno s ostalim začinima.
    goal: ravnomjerno raspoređeni začini i povezan nadjev
    critical_control: začini ne smiju ostati u nakupinama
    problem: neujednačen okus i boja
    solution: miješati dulje, razbijati nakupine paprike i raditi u širokoj posudi
    source_status: confirmed_pavicic_plus_supporting_source
  - phase_no: 4
    title: Kratko odležavanje nadjeva
    duration: 1–2 sata
    temperature_c: prohladna prostorija
    action: >
      Nakon miješanja nadjev ostaviti kratko u prohladnoj prostoriji da se
      smjesa smiri i da se začini ravnomjernije povežu s mesom.
    goal: stabilniji nadjev prije punjenja
    critical_control: nadjev ne smije stajati na toplom
    problem: kiselkast ili neugodan miris prije punjenja
    solution: takav nadjev ne puniti; ubuduće skratiti stajanje i raditi hladnije
    source_status: confirmed_pavicic
  - phase_no: 5
    title: Punjenje u tanka svinjska crijeva
    duration: odmah nakon odležavanja nadjeva
    temperature_c: prohladno
    action: >
      Nadjev puniti u dobro oprana i namočena tanka svinjska crijeva.
      Oblikovati parove dužine 40–60 cm i krajeve povezati špagom.
    goal: čvrsto, ravnomjerno napunjena kobasica bez zračnih džepova
    critical_control: ne ostavljati praznine u crijevu
    problem: zračni džepovi
    solution: puniti ujednačeno; vidljive mjehuriće probosti čistom iglom
    source_status: confirmed_pavicic
  - phase_no: 6
    title: Predsušenje nakon punjenja
    duration: 1–2 dana
    temperature_c: zračna, čista i prohladna prostorija
    action: >
      Svježe kobasice objesiti na drvene štapove da se površina osuši,
      stegne i pripremi za dimljenje.
    goal: suha i stabilna površina prije dima
    critical_control: kobasice se ne smiju međusobno dodirivati
    problem: ljepljiva površina
    solution: pojačati razmak, osigurati blago strujanje zraka i ne žuriti s dimom
    source_status: confirmed_pavicic
  - phase_no: 7
    title: Hladno dimljenje
    duration: 5–7 dana svakodnevno prema Pavičiću; alternativno 4–5 dimova svaki drugi dan prema drugom izvoru
    temperature_c: hladni dim, točna temperatura nije navedena u izvoru
    smoke: hladni dim
    action: >
      Kobasice dimiti blagim hladnim dimom. Jedan izvor navodi svakodnevno
      dimljenje 5–7 dana, a drugi 4–5 dimova svaki drugi dan, ukupno 8–10 dana.
    goal: blaga dimna aroma, površinska zaštita i postupno sušenje
    critical_control: dim ne smije biti gust, vruć ni gorak
    problem: gorka aroma i pretamna površina
    solution: smanjiti dim, koristiti suho tvrdo drvo i ostaviti dovoljno prozračivanja
    source_status: confirmed_two_source_variants
  - phase_no: 8
    title: Sušenje i zrenje
    duration: do 60 dana
    temperature_c: suha, zračna i umjereno hladna prostorija
    action: >
      Nakon dimljenja kobasice premjestiti u prostor za sušenje i zrenje.
      Proces voditi polako, uz zračnost i bez naglog isušivanja površine.
    goal: razviti čvrstoću, stabilan presjek, miris i okus zrele slavonske kobasice
    critical_control: ne izlagati jakom propuhu ni previsokoj toplini
    problem: tvrda kora, a mekana sredina
    solution: smanjiti propuh, usporiti sušenje i omogućiti ravnomjernije zrenje
    source_status: confirmed_pavicic

done_when:
  - criterion: kobasica je umjereno čvrsta i stabilna na dodir
    explanation: ne smije biti vlažna, ljepljiva ni mekana u sredini
  - criterion: presjek je povezan i bez razmazane masti
    explanation: vidljiva struktura mesa i slanine potvrđuje dobru temperaturu obrade
  - criterion: miris je čist, dimno-začinski i bez kiselih ili truležnih nota
    explanation: neugodan miris znači da se proizvod ne smije konzumirati

safety:
  - risk: pretopla smjesa tijekom mljevenja i miješanja
    control: raditi s dobro ohlađenim mesom i slaninom
    action_if_problem: prekinuti rad i vratiti sirovinu na hlađenje
  - risk: zračni džepovi u crijevu
    control: ravnomjerno punjenje i probadanje čistom iglom
    action_if_problem: odmah ispustiti zrak prije predsušenja
  - risk: prejak ili vruć dim
    control: koristiti blagi hladni dim i dovoljno zraka
    action_if_problem: prekinuti dimljenje, prozračiti pušnicu i nastaviti blaže
  - risk: neujednačeno sušenje
    control: održavati razmak između kobasica i stabilan protok zraka
    action_if_problem: premjestiti kobasice, smanjiti propuh i produljiti zrenje

serving_storage:
  serving: >
    Zrela slavonska domaća kobasica poslužuje se tanko narezana kao narezak,
    uz kruh, sir, kiselo povrće i druge suhomesnate proizvode. Svježa ili kratko
    prosušena varijanta može se termički pripremati, ali potpuno suha kobasica
    ne tretira se kao kobasica za pečenje.
  storage: >
    Čuvati u hladnom, tamnom, suhom i prozračnom prostoru. Nakon rezanja
    zaštititi presjek i pratiti miris.
  shelf_life: ovisi o stupnju osušenosti i uvjetima čuvanja
