identity:
  short_description: >
    Slavonska domaća kobasica je tradicionalna sušena i dimljena kobasica
    od svinjskog mesa, tvrde leđne slanine, paprike, soli i češnjaka.
    U ovom dosjeu obrađuje se domaća, neregulirana varijanta, odvojeno
    od ZOI/EU recepta.
  traditional_context: >
    Recept pripada slavonskom kobasičarskom modelu u kojem paprika,
    češnjak, hladni dim i postupno zrenje određuju prepoznatljiv miris,
    boju i okus.
  protected_status: nije_ZOI_prikaz
  source_confidence: high
  source_note: >
    Kanonski draft temelji se na projektnom izvoru Slavonske kobasice
    i Pavičićevu receptu za Slavonske kobasice. Javni tekst mora biti
    preoblikovan, bez doslovnog prepisivanja.

