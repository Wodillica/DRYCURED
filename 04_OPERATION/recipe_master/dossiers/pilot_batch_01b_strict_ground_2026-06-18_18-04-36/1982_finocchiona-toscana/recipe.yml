  - "nema sluzi, napuhavanja, truležnog mirisa ni neobičnih plijesni"
  - "ciljani laboratorijski kriteriji su pH 5,0-6,0 i aw ≤ 0,945"
problems_and_solutions:
  -
    problem: "Razmazana mast u presjeku"
    likely_cause: "sirovina ili nož/rešetka su bili pretopli; korištena je mekana masnoća"
    solution: "zaustaviti rad, ohladiti meso i opremu, ukloniti mekanu masnoću i nastaviti tek kada masa ponovno bude čvrsta"
  -
    problem: "Suha kora i mekana jezgra"
    likely_cause: "prejak propuh ili preniska vlaga u sušenju"
    solution: "smanjiti strujanje zraka, povisiti relativnu vlagu unutar sigurnog raspona i produžiti zrenje"
  -
    problem: "Kiseo okus"
    likely_cause: "prebrza ili nekontrolirana fermentacija, previše šećera ili previsoka temperatura"
    solution: "ne nuditi proizvod; za sljedeću šaržu smanjiti šećer, voditi temperaturu i koristiti provjereni starter samo uz točnu dozu"
  -
    problem: "Neobične plijesni ili sluzav ovitak"
    likely_cause: "loša higijena, previsoka vlaga ili slab protok zraka"
    solution: "ako je miris neugodan ili sluzavost prodire u ovitak, proizvod odbaciti; prostor očistiti, osušiti i stabilizirati RH"
  -
    problem: "Napuhavanje ili šupljine"
    likely_cause: "zrak u punjenju ili mikrobiološki kvar"
    solution: "male zračne džepove odmah probosti sterilnom iglom; ako se pojavi napuhavanje uz neugodan miris, proizvod odbaciti"
  -
    problem: "Žućenje masti i užegao miris"
    likely_cause: "oksidacija zbog loše masnoće, dugog kontakta s kisikom ili lošeg skladištenja"
    solution: "ne koristiti za posluživanje; u sljedećoj šarži koristiti svježiju čvrstu masnoću i smanjiti izlaganje zraku"
serving_and_storage:
  serving: "Rezati tanko kao suhu salamu. Ne tretirati kao kobasicu za pečenje."
  storage: "Čuvati u hladnom i prozračnom prostoru ili vakuumirati nakon završnog zrenja, uz kontrolu mirisa i površine."
  public_note: "Ako postoji ikakva sumnja u zdravstvenu ispravnost, proizvod se ne kuša i ne poslužuje."
