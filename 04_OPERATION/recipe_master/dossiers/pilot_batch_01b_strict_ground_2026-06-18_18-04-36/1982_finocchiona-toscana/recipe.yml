process:
  -
    step: 1
    name: "Odabir i hlađenje sirovine"
    parameters: "0-4 °C"
    action: "Koristiti svježe, nesmrznuto svinjsko meso dopuštenih rezova. Ukloniti veće opne, žlijezde i meku masnoću."
    critical_control: "Meso ne smije mirisati kiselo, ljepljivo ili ustajalo."
  -
    step: 2
    name: "Rezanje"
    parameters: "20-30 mm komadi"
    action: "Rezati na komade prikladne za mljevenje i ponovno ohladiti."
    critical_control: "Ako se masnoća lijepi za nož, masa nije dovoljno hladna."
  -
    step: 3
    name: "Mljevenje"
    parameters: "rešetka 6 mm; dopušteni službeni raspon 4,5-8 mm"
    action: "Meso i čvršću masnoću samljeti srednje krupno."
    critical_control: "Presjek mora ostati srednje krupan, bez razmazane masnoće."
  -
    step: 4
    name: "Miješanje"
    parameters: "masa najviše 8 °C"
    action: "Sol, papar, suhi češnjak, komorač i šećer ravnomjerno umiješati; vino dodati postupno u tankom mlazu."
    critical_control: "Miješati do povezivanja, ali ne toliko dugo da se masa zagrije."
  -
    step: 5
    name: "Punjenje i vezanje"
    parameters: "prirodni ili collato ovitak; komad najmanje 0,5 kg"
    action: "Napuniti pripremljeni ovitak, istisnuti zrak, vezati špagom."
    critical_control: "Masa mora ispuniti ovitak bez šupljina."
  -
    step: 6
    name: "Sušenje / asciugamento"
    parameters: "12-25 °C prema disciplinaru"
    action: "Nakon punjenja proizvod držati u uvjetima koji omogućuju početnu dehidraciju."
    critical_control: "Ne dopustiti prebrzo stvaranje suhe kore; po potrebi smanjiti propuh i povisiti vlagu."
  -
    step: 7
    name: "Zrenje / stagionatura"
    parameters: "11-18 °C; 65-90 % RH"
    action: "Zriti do stabilnog presjeka, izražene arome komorača i sigurnih analitičkih ciljeva."
    critical_control: "Za komad 1-6 kg ukupno sušenje i zrenje ne smije biti kraće od 21 dan; za 0,5-1 kg najmanje 15 dana; za 6-25 kg najmanje 45 dana."
  -
    step: 8
    name: "Završna provjera"
    parameters: "pH 5,0-6,0; aw ≤ 0,945; mast ≤ 35 %"
    action: "Prije javne objave/konzumacije potvrditi sigurnosne i senzorske kriterije."
    critical_control: "Ako je okus kiseo, miris neugodan, ovitak sluzav ili presjek nepravilan, proizvod ne ide u konzumaciju."
